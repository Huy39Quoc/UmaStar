spring.application.name=${APP_NAME}
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}

# Front-end CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Upload file
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
app.upload.dir=${UPLOAD_DIR}

# JSON / Timezone
spring.jackson.time-zone=UTC

# JWT & Auth
app.jwt.secret=${JWT_SECRET}
app.jwt.access-exp-ms=${JWT_ACCESS_EXP_MS}
app.jwt.refresh-exp-ms=${JWT_REFRESH_EXP_MS}
app.auth.reset-token-exp-ms=${RESET_TOKEN_EXP_MS:1800000}
app.auth.reset-cooldown-ms=${RESET_COOLDOWN_MS:60000}

# Seed accounts theo tung Role (de trong trong .env neu khong muon tu tao role do)
# 1. LOGISTICS_MANAGER - Quan ly Dieu hanh Logistics
app.seed.accounts.LOGISTICS_MANAGER.email=${SEED_MANAGER_EMAIL:}
app.seed.accounts.LOGISTICS_MANAGER.password=${SEED_MANAGER_PASSWORD:}
# 2. TRANSPORT_SPECIALIST - Chuyen vien Thu tuc & Kiem dich
app.seed.accounts.TRANSPORT_SPECIALIST.email=${SEED_SPECIALIST_EMAIL:}
app.seed.accounts.TRANSPORT_SPECIALIST.password=${SEED_SPECIALIST_PASSWORD:}
# 3. FLEET_COORDINATOR - Dieu phoi vien Doi xe & Lo trinh
app.seed.accounts.FLEET_COORDINATOR.email=${SEED_COORDINATOR_EMAIL:}
app.seed.accounts.FLEET_COORDINATOR.password=${SEED_COORDINATOR_PASSWORD:}
# 4. DRIVER - Tai xe van chuyen
app.seed.accounts.DRIVER.email=${SEED_DRIVER_EMAIL:}
app.seed.accounts.DRIVER.password=${SEED_DRIVER_PASSWORD:}
# 5. ESCORT - Nhan vien di kem cham soc ngua
app.seed.accounts.ESCORT.email=${SEED_ESCORT_EMAIL:}
app.seed.accounts.ESCORT.password=${SEED_ESCORT_PASSWORD:}
# 6. CUSTOMER - Khach hang (CLB / Chu ngua)
app.seed.accounts.CUSTOMER.email=${SEED_CUSTOMER_EMAIL:}
app.seed.accounts.CUSTOMER.password=${SEED_CUSTOMER_PASSWORD:}
