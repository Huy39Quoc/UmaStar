spring.application.name=${APP_NAME}
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}

# Upload file
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
app.upload.dir=${UPLOAD_DIR}

# JSON / Timezone
spring.jackson.time-zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-exp-ms=${JWT_ACCESS_EXP_MS}
app.jwt.refresh-exp-ms=${JWT_REFRESH_EXP_MS}

# Manager
app.seed.manager.email=${SEED_MANAGER_EMAIL}
app.seed.manager.password=${SEED_MANAGER_PASSWORD}